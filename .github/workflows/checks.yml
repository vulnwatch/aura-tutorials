name: Checks

# Every pull request and every push to main: the shell scripts, the scripts of
# the tutorials, and the lock against a capture of the pinned Aura
# (docs/authoring.md, Publication). The capture is of the tutorials that the
# change can affect: all of them when it touches what every capture depends
# on, otherwise those whose script or entry of the lock changed, while the
# lock must be current for every tutorial. A weekly run on main, and a manual
# one, capture every tutorial, to catch what no diff shows, such as an image
# that a tag moved. The job Tutorials against Aura always runs and narrows its
# scope inside, so that a required check never waits for a job that did not
# run. On a pull request, the tutorials whose entry of the lock changed, or all
# of them when the tooling or src/tutorials.mjs changes, are rendered too, with
# the checks of their composition, which fail the job, and kept with their
# subtitles and contact sheets as an artifact to review (docs/authoring.md, Review). The
# website is generated too, and kept as an artifact.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 04:23 UTC.
    - cron: "23 4 * * 1"
  workflow_dispatch:

# A new commit of a pull request cancels the run of the earlier one. Every
# other run has a group of its own and completes: a push to main is checked
# for what it changes alone, so a later push must not cancel its run.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Lint the shell scripts
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh

      - name: Validate the scripts, the flows, and the catalog
        run: scripts/tutorials.sh validate

  tutorials:
    name: Tutorials against Aura
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # The whole history: the base of a pull request, and the tags of
          # the submodule, which name the version of Aura
          # (scripts/lib/common.sh, aura_version).
          fetch-depth: 0

      # Captures the tutorials that the change can affect (scripts/tutorials.sh,
      # affected): those of the pull request against its base, or of the push
      # against the commit that main held before; every tutorial on the weekly
      # and the manual run, and when that commit is unknown, as after a forced
      # push. Fails when a video needs a render or a script a change, or when
      # the lock is not current for any tutorial, captured or not.
      - name: Check the tutorials against the lock
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "${EVENT_NAME}" in
            pull_request) since="origin/${BASE_REF}" ;;
            push) since="${BEFORE}" ;;
            *) since="" ;;
          esac
          if [[ -n "${since}" ]] && git rev-parse --verify --quiet "${since}^{commit}" >/dev/null; then
            scripts/tutorials.sh check --verify-only --since "${since}"
          else
            scripts/tutorials.sh check --verify-only
          fi

      - name: Report
        if: always()
        run: |
          if [[ -f out/report/check.md ]]; then
            cat out/report/check.md >>"${GITHUB_STEP_SUMMARY}"
          fi

      # The tutorials whose entry of the lock changed; every tutorial when the
      # tooling changes, which needs no new video when the screens are
      # unchanged, so that the videos show that the new tooling still renders
      # them well (docs/authoring.md, Update the Tools), and when
      # src/tutorials.mjs changes, which reports the checks and extracts the
      # frames without making a video stale. The findings of the checks of
      # their composition fail the step once the videos and their contact
      # sheets are made, so that the artifact shows them. Each is rendered
      # from the capture of the check above, which captured it in this job,
      # since what selects a tutorial here selects it there too.
      - name: Render the tutorials that the pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/${BASE_REF}" -- Containerfile package.json package-lock.json src/tutorials.mjs; then
            mapfile -t changed < <(scripts/release.sh changed "origin/${BASE_REF}")
          else
            mapfile -t changed < <(find tutorials -maxdepth 1 -name '*.json' -printf '%f\n' | sed 's/\.json$//' | sort)
            echo "The tooling or src/tutorials.mjs changes: every tutorial is rendered with it." >>"${GITHUB_STEP_SUMMARY}"
          fi
          if ((${#changed[@]} > 0)); then
            status=0
            scripts/tutorials.sh render --strict --reuse-capture "${changed[@]}" || status=1
            for id in "${changed[@]}"; do
              if [[ -f "out/${id}/${id}.mp4" ]]; then
                scripts/tutorials.sh frames "${id}" || status=1
              fi
            done
            echo "Rendered ${changed[*]}: see the artifact tutorials." >>"${GITHUB_STEP_SUMMARY}"
            exit "${status}"
          fi

      # The website, with the videos just rendered and those of the latest
      # release, to look at before the merge. It fails while Publish still
      # renders a tutorial that main just gained, which no release holds yet:
      # run the job again once Publish is done.
      - name: Generate the website
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/tutorials.sh site --release
          echo "The website holds $(du -sm out/site | cut -f 1) MB: see the artifact site." >>"${GITHUB_STEP_SUMMARY}"

      - name: Keep the website
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: out/site/
          retention-days: 14

      - name: Keep the videos, their subtitles, their contact sheets, and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tutorials
          path: |
            out/*/*.mp4
            out/*/*.vtt
            out/*/frames/chapter-*.png
            out/*/frames/cards.png
            out/*/frames/frames.md
            out/report/
            out/*/capture/failure.png
          if-no-files-found: ignore
          retention-days: 14
