name: Checks

# Every pull request and every push to main: the shell scripts, the scripts of
# the tutorials, and the lock against a capture of the pinned Aura
# (docs/authoring.md, Publication). On a pull request, the tutorials whose
# entry of the lock changed, or all of them when the tooling or
# src/tutorials.mjs changes, are
# rendered too, with the checks of their composition, which fail the job, and
# kept with their contact sheets as an artifact to review (docs/authoring.md,
# Review).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Lint the shell scripts
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh

      - name: Validate the scripts, the flows, and the catalog
        run: scripts/tutorials.sh validate

  tutorials:
    name: Tutorials against Aura
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # The whole history: the base of a pull request, and the tags of
          # the submodule, which name the version of Aura
          # (scripts/lib/common.sh, aura_version).
          fetch-depth: 0

      # Captures every tutorial, and fails when a video needs a render or a
      # script a change, or when the lock is not current.
      - name: Check every tutorial against the lock
        run: scripts/tutorials.sh check --verify-only

      - name: Report
        if: always()
        run: |
          if [[ -f out/report/check.md ]]; then
            cat out/report/check.md >>"${GITHUB_STEP_SUMMARY}"
          fi

      # The tutorials whose entry of the lock changed; every tutorial when the
      # tooling changes, which needs no new video when the screens are
      # unchanged, so that the videos show that the new tooling still renders
      # them well (docs/authoring.md, Update the Tools), and when
      # src/tutorials.mjs changes, which reports the checks and extracts the
      # frames without making a video stale. The findings of the checks of
      # their composition fail the step once the videos and their contact
      # sheets are made, so that the artifact shows them.
      - name: Render the tutorials that the pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/${BASE_REF}" -- Containerfile package.json package-lock.json src/tutorials.mjs; then
            mapfile -t changed < <(scripts/release.sh changed "origin/${BASE_REF}")
          else
            mapfile -t changed < <(find tutorials -maxdepth 1 -name '*.json' -printf '%f\n' | sed 's/\.json$//' | sort)
            echo "The tooling or src/tutorials.mjs changes: every tutorial is rendered with it." >>"${GITHUB_STEP_SUMMARY}"
          fi
          if ((${#changed[@]} > 0)); then
            status=0
            scripts/tutorials.sh render --strict "${changed[@]}" || status=1
            for id in "${changed[@]}"; do
              if [[ -f "out/${id}/${id}.mp4" ]]; then
                scripts/tutorials.sh frames "${id}" || status=1
              fi
            done
            echo "Rendered ${changed[*]}: see the artifact tutorials." >>"${GITHUB_STEP_SUMMARY}"
            exit "${status}"
          fi

      - name: Keep the videos, their contact sheets, and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tutorials
          path: |
            out/*/*.mp4
            out/*/frames/chapter-*.png
            out/*/frames/cards.png
            out/*/frames/frames.md
            out/report/
            out/*/capture/failure.png
          if-no-files-found: ignore
          retention-days: 14
