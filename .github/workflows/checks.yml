name: Checks

# Every pull request and every push to main: the shell scripts, the scripts of
# the tutorials, and the lock against a capture of the pinned Aura
# (docs/authoring.md, Publication). On a pull request, the tutorials whose
# entry of the lock changed are rendered too, as an artifact to review.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Lint the shell scripts
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh

      - name: Validate the scripts, the flows, and the catalog
        run: scripts/tutorials.sh validate

  tutorials:
    name: Tutorials against Aura
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          # The whole history: the base of a pull request, and the tags of
          # the submodule, which name the version of Aura
          # (scripts/lib/common.sh, aura_version).
          fetch-depth: 0

      # Captures every tutorial, and fails when a video needs a render or a
      # script a change, or when the lock is not current.
      - name: Check every tutorial against the lock
        run: scripts/tutorials.sh check --verify-only

      - name: Report
        if: always()
        run: |
          if [[ -f out/report/check.md ]]; then
            cat out/report/check.md >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: Render the tutorials that the pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -t changed < <(scripts/release.sh changed "origin/${BASE_REF}")
          if ((${#changed[@]} > 0)); then
            scripts/tutorials.sh render "${changed[@]}"
            echo "Rendered ${changed[*]}: see the artifact tutorials." >>"${GITHUB_STEP_SUMMARY}"
          fi

      - name: Keep the videos and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tutorials
          path: |
            out/*/*.mp4
            out/report/
            out/*/capture/failure.png
          if-no-files-found: ignore
          retention-days: 14
