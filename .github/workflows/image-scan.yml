name: Image Scan

# Non-blocking scan of the image of the website of the latest release for
# known vulnerabilities of its operating system packages, weekly and after
# each run of Publish, as Aura scans its image. A scan finding is data for the
# tracking issue, never a failure; only a scan that does not complete fails
# the run. See docs/deployment.md (Vulnerability Scan).

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  # After a release: Publish publishes the GitHub Release with the
  # GITHUB_TOKEN, whose events start no workflow run, so the scan follows the
  # completed run instead of the release's published event.
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
  workflow_dispatch:

# A run that is writing the tracking issue finishes before the next starts.
concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  image-scan:
    name: Image Scan
    # Only a successful run of Publish has published its release.
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image of the latest release, which GitHub marks as Latest, by the
      # digest that its image tag names: the package is public, so the pull
      # needs no credentials.
      - name: Pull the image of the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          image="$(scripts/image.sh pull "${tag}")"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "image=${image}" >>"${GITHUB_OUTPUT}"
      # Trivy, from the image that the script pins, runs with the runner's
      # user and group IDs, without capabilities, on an archive of the image,
      # read-only; it receives neither the Docker socket nor a token.
      - name: Scan for vulnerabilities
        run: scripts/image.sh scan "${RUNNER_TEMP}/trivy"
      - name: Retain the complete report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-full
          path: ${{ runner.temp }}/trivy/trivy-full.txt
          if-no-files-found: error
          retention-days: 90
      # Handed to the Scan Tracking Issue job, so that the write access to
      # issues never reaches the job that runs the scanner.
      - name: Retain the report of fixable vulnerabilities
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fixable
          path: ${{ runner.temp }}/trivy/trivy-fixable.json
          if-no-files-found: error
          retention-days: 1

  # The issue tracks the image of the latest release: a manual run on another
  # branch than main scans the same image with the scanner of that branch and
  # keeps its reports, but leaves the issue alone.
  tracking-issue:
    name: Scan Tracking Issue
    needs: image-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-fixable
          path: ${{ runner.temp }}/trivy
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TAG: ${{ needs.image-scan.outputs.tag }}
          IMAGE: ${{ needs.image-scan.outputs.image }}
        run: >-
          scripts/image-scan-issue.sh "${RUNNER_TEMP}/trivy/trivy-fixable.json"
          "${TAG}" "${IMAGE}"
