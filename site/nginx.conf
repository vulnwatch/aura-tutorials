# The web server of the image of the website (site/Containerfile,
# docs/deployment.md), whose answers scripts/image.sh test checks: it serves the files of /srv/site on port 8080, as any
# user without a capability, on a read-only root filesystem, and writes only
# under /tmp.

worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # WebVTT, which the types of nginx lack, for the subtitles and the
    # chapters of the videos.
    include /etc/nginx/mime.types;
    types {
        text/vtt vtt;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/vtt application/javascript;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # What nginx would write for a request or a response. The site has no
    # upload and no upstream, but nginx creates the directories when it starts.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /srv/site;
        index index.html;

        # The redirect of a directory without its slash keeps the scheme, the
        # host, and the port of the request, which only the ingress knows.
        absolute_redirect off;

        # The headers of every answer, the 404 included (docs/deployment.md,
        # Runtime); scripts/image.sh test checks them. The site holds only
        # files of its own origin, and no page has a style or a script of its
        # own, so the policy allows nothing else, and no page may frame it.
        # A page, a video, or an asset keeps its address from a release to
        # the next, so a browser asks each time whether its copy is current.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; media-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
